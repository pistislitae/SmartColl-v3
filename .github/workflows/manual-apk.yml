name: Build SmartColl Clean APK
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Private source repository (owner/name)
        required: true
        default: pistislitae/SmartColl-v3-Priv
      source_ref:
        description: Branch, tag, or commit SHA
        required: true
        default: main
      build_type:
        type: choice
        options: [debug, release]
        default: debug
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private Clean source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore optional release keystore
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/smartcoll-release.jks"
      - name: Install, test, and sync Android
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android
          chmod +x android/gradlew
      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Build signed release APK
        if: inputs.build_type == 'release'
        env:
          SMARTCOLL_KEYSTORE_PATH: ${{ runner.temp }}/smartcoll-release.jks
          SMARTCOLL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMARTCOLL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMARTCOLL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$SMARTCOLL_KEYSTORE_PASSWORD"
          test -n "$SMARTCOLL_KEY_ALIAS"
          test -n "$SMARTCOLL_KEY_PASSWORD"
          cd android && ./gradlew --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p artifact
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} artifact/ \;
          test -n "$(find artifact -name '*.apk' -print -quit)"
      - name: Verify release signature
        if: inputs.build_type == 'release'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose artifact/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmartColl-Clean-${{ inputs.build_type }}-APK
          path: artifact/*.apk
          if-no-files-found: error
          retention-days: 14
